meters:
- name: platform_subscription
  description: Annual Snorkel Flow platform subscription / commitment value.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - deployment
- name: seats
  description: Licensed platform users / seats included in the agreement.
  unit: users
  aggregation: sum
  dimensions:
  - account
- name: instance_compute
  description: >-
    Provisioned Snorkel Flow instance compute footprint backing labeling,
    training, and evaluation workloads.
  unit: compute
  aggregation: sum
  dimensions:
  - account
  - deployment
- name: expert_data_engagement
  description: >-
    Snorkel Expert Data-as-a-Service custom dataset / benchmark engagement
    value, scoped per project.
  unit: engagement
  aggregation: sum
  dimensions:
  - account
  - project
principles:
- name: Visibility
  description: >-
    Track contract value, seat counts, and provisioned instance footprint;
    there are no public per-call meters to export.
- name: Allocation
  description: >-
    Map seats, projects, and expert-data engagements to internal teams and
    cost centers.
- name: Optimization
  description: >-
    Right-size seats and instance compute to actual usage; use the free
    open-source snorkel library for workloads that do not require the platform;
    scope expert-data engagements tightly.
- name: Accountability
  description: >-
    Assign owners per platform project and per expert-data engagement; review
    contract utilization against budget on the renewal cycle.
