description: >-
  FinOps view of Snorkel AI spend. Snorkel's commercial model is sales-led and
  contract-based rather than metered per-API-call: the enterprise Snorkel Flow
  platform and Snorkel Expert Data-as-a-Service are negotiated annual / per-
  engagement agreements, scaling by users, data volume, deployment model, and
  professional services. The open-source snorkel library is free. There is no
  public usage-based price list, so cost allocation centers on contract value,
  seats, and provisioned instance / compute footprint rather than per-token or
  per-request meters.
notes: >-
  Per-engagement and per-instance costs are negotiated and not publicly
  metered; reconcile against the order form, instance sizing, and any
  cloud/compute pass-through during a FinOps review.
sources:
- https://snorkel.ai/snorkel-flow/
- https://snorkel.ai/expert-data-as-a-service/
