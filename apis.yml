  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://snorkel.ai/
  properties:
  - url: https://docs.snorkel.ai/docs/25.3/user-guide/sdk/
    type: Documentation
  - url: https://docs.snorkel.ai/docs/0.95/sdk/
    type: APIReference
  - url: openapi/snorkel-ai-openapi.yml
    type: OpenAPI
  description: Platform and SDK capabilities for assessing model performance across
    data splits, running error and slice analysis, and building expert-curated
    benchmarks. Largely delivered in-platform and through the SDK against a customer's
    Snorkel Flow instance rather than a public REST endpoint.
- aid: snorkel-ai:open-source-snorkel-library
  name: Open-Source Snorkel Library
  tags:
