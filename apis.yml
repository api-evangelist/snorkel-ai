    type: Documentation
  - url: https://snorkel.readthedocs.io/
    type: APIReference
  - url: https://github.com/snorkel-team/snorkel
    type: GitHub
  description: The free, open-source snorkel Python library (Apache-2.0) for
    programmatically building and managing training data with weak supervision -
    labeling functions, the LabelModel, transformation functions, and slicing
    functions. Imported as a local Python dependency (pip install snorkel); not a
    hosted network API.
